<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1119">
<meta name="robots" content="noindex,nofollow">
<title>ラスベガス出張 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300&family=Zen+Kaku+Gothic+New:wght@400;500&family=IBM+Plex+Mono:wght@300&display=swap" rel="stylesheet">
<style>
:root{--fg:#eef2ef;--fg2:rgba(238,242,239,.74);--fg3:rgba(238,242,239,.5);--l1:rgba(238,242,239,.15);--l2:rgba(238,242,239,.32);--l3:rgba(238,242,239,.62)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0a1119}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom));color:var(--fg);font-family:"Zen Kaku Gothic New","Hiragino Sans","Meiryo",sans-serif;font-size:16px;line-height:1.7;overflow-x:hidden}
.hidden{display:none!important}
/* 背景：ぼかした色面がゆっくり動く */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;animation:drift 24s ease-in-out infinite alternate}
.bg i:nth-child(1){width:95vw;height:65vh;left:-35vw;top:-18vh;background:#4E7A2C}
.bg i:nth-child(2){width:85vw;height:60vh;right:-38vw;top:28vh;background:#2C6A68;animation-delay:-8s}
.bg i:nth-child(3){width:85vw;height:55vh;left:-15vw;bottom:-28vh;background:#1C3656;animation-delay:-16s}
@keyframes drift{to{transform:translate(6vw,4vh) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.bg i{animation:none}}
/* 幾何の飾り（細い白線の円と多角形） */
.geo{position:fixed;left:50%;top:50%;width:min(140vw,900px);height:min(140vw,900px);transform:translate(-50%,-50%);z-index:-1;opacity:.5;pointer-events:none}
.geo *{fill:none;stroke:rgba(238,242,239,.12);stroke-width:1}
.geo .dot{fill:rgba(238,242,239,.35);stroke:none}
.geo g{transform-origin:450px 450px;animation:turn 120s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.geo g{animation:none}}

.card{position:relative;width:100%;max-width:400px;padding:36px 28px 30px;background:rgba(10,17,25,.5);border:1px solid var(--l1);border-radius:2px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card::before,.card::after{content:"";position:absolute;width:16px;height:16px;border-color:var(--l3);border-style:solid}
.card::before{left:-1px;top:-1px;border-width:1px 0 0 1px}
.card::after{right:-1px;bottom:-1px;border-width:0 1px 1px 0}
.eyebrow{font-family:"Josefin Sans",sans-serif;font-weight:300;letter-spacing:.3em;font-size:11px;text-transform:uppercase;color:var(--fg2);margin:0 0 14px}
h1{font-size:26px;font-weight:500;letter-spacing:.04em;margin:0 0 6px;line-height:1.4}
.lead{color:var(--fg2);font-size:15px;margin:0 0 26px}
.dates{display:flex;align-items:center;gap:10px;font-family:"IBM Plex Mono",monospace;font-weight:300;font-size:14px;color:var(--fg2);margin:0 0 28px;padding:10px 0;border-top:1px solid var(--l1);border-bottom:1px solid var(--l1)}
.dates span.line{flex:1;height:1px;background:var(--l2)}
label.field{display:block;font-size:14px;color:var(--fg2);margin-bottom:8px}
.pw{display:flex;align-items:stretch;border:1px solid var(--l2);border-radius:2px;background:rgba(10,17,25,.55);transition:border-color .15s}
.pw:focus-within{border-color:var(--fg)}
.pw input{flex:1;min-width:0;height:54px;padding:0 14px;font:inherit;font-size:18px;letter-spacing:.08em;color:var(--fg);background:transparent;border:0;outline:none}
.pw input::placeholder{color:var(--fg3);letter-spacing:normal;font-size:16px}
.pw button{flex:none;min-width:64px;font:inherit;font-size:13px;color:var(--fg2);background:transparent;border:0;border-left:1px solid var(--l1);cursor:pointer}
.err{min-height:24px;margin:8px 0 0;font-size:14px;color:#E89A8E}
.remember{display:flex;align-items:center;gap:10px;min-height:44px;margin:6px 0 18px;font-size:15px;color:var(--fg2);cursor:pointer;user-select:none}
.remember input{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:0;border:1px solid var(--l3);border-radius:2px;display:grid;place-content:center;cursor:pointer}
.remember input:checked{background:var(--fg);border-color:var(--fg)}
.remember input:checked::after{content:"";width:10px;height:6px;border:2px solid #0a1119;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.go{width:100%;height:56px;font:inherit;font-size:17px;font-weight:500;letter-spacing:.2em;color:#0a1119;background:var(--fg);border:1px solid var(--fg);border-radius:2px;cursor:pointer;transition:opacity .15s}
.go:active{opacity:.85}
.go[disabled]{opacity:.6}
.foot{margin:22px 0 0;font-size:13px;color:var(--fg3);line-height:1.6}
.loading{display:flex;flex-direction:column;align-items:center;gap:16px;color:var(--fg2);font-size:14px}
.ring{width:44px;height:44px;border:1px solid var(--l1);border-top-color:var(--fg);border-radius:50%;animation:turn .9s linear infinite}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body class="staticrypt-body">
<div class="bg"><i></i><i></i><i></i></div>
<svg class="geo" viewBox="0 0 900 900" aria-hidden="true"><g>
  <circle cx="450" cy="450" r="330"/><circle cx="450" cy="450" r="250"/>
  <polygon points="450,120 735.8,285 735.8,615 450,780 164.2,615 164.2,285"/>
  <polygon points="450,200 666.5,575 233.5,575"/>
  <circle class="dot" cx="450" cy="120" r="3"/><circle class="dot" cx="735.8" cy="615" r="3"/><circle class="dot" cx="164.2" cy="615" r="3"/>
</g></svg>

<div id="staticrypt_loading" class="loading"><div class="ring"></div>ひらいています…</div>

<main id="staticrypt_content" class="card hidden">
  <p class="eyebrow">re:Invent 2026 · Las Vegas</p>
  <h1>ラスベガス出張</h1>
  <p class="lead">家族向けのページです。<br>パスワードを入れてください</p>
  <div class="dates"><span>11.28</span><span class="line"></span><span>12.06</span></div>

  <form id="staticrypt-form" action="#" method="post" autocomplete="on">
    <label class="field" for="staticrypt-password">パスワード</label>
    <div class="pw" id="pwbox">
      <input id="staticrypt-password" type="password" name="password" placeholder="パスワード" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus>
      <button type="button" id="toggle" aria-label="Show password">表示</button>
    </div>
    <p class="err" id="err" role="alert"></p>
    <label id="staticrypt-remember-label" class="remember hidden">
      <input id="staticrypt-remember" type="checkbox" name="remember" checked>
      この端末で7日覚える
    </label>
    <button type="submit" class="go" id="go">ひらく</button>
  </form>
  <p class="foot">わからないときは連絡してください。</p>
</main>
