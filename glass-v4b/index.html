stub.addEventListener('pointerdown',e=>{if(!admitted||tearing||e.button>0)return;stopHint();if(springAnim)springAnim.cancel();drag={id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,dy:0,p0:T.p,ax:0,ay:0};stub.setPointerCapture(e.pointerId);stub.classList.add('dragging');ticket.dataset.state='pulling';});
stub.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;e.preventDefault();drag.dx=e.clientX-drag.x;drag.dy=e.clientY-drag.y;
 if(!T.detached){const d=Math.max(0,drag.dx)*.9+Math.max(0,drag.dy)*.6-3;pullTo(drag.p0+d/PULL_FULL);if(T.detached){drag.ax=drag.dx;drag.ay=drag.dy;}}
 else{T.fx=(drag.dx-drag.ax)*.95+4;T.fy=(drag.dy-drag.ay)*.95+2;T.fr=Math.max(-10,Math.min(18,(drag.dx-drag.ax)*.05+(drag.dy-drag.ay)*.04));render();}});
function endDrag(e,cancel){if(!drag||drag.id!==e.pointerId)return;drag=null;stub.classList.remove('dragging');if(stub.hasPointerCapture(e.pointerId))stub.releasePointerCapture(e.pointerId);if(T.detached&&!cancel)tear();else if(T.detached){tear();}else springBack();}
stub.addEventListener('pointerup',e=>endDrag(e,false));stub.addEventListener('pointercancel',e=>endDrag(e,true));
stub.addEventListener('keydown',e=>{if(admitted&&(e.key==='Enter'||e.key===' ')){e.preventDefault();autoTear();}});
let wheelIdle=null;stub.addEventListener('wheel',e=>{if(!admitted||tearing)return;e.preventDefault();stopHint();if(springAnim)springAnim.cancel();pullTo(T.p+(Math.abs(e.deltaX)+Math.abs(e.deltaY))/700);clearTimeout(wheelIdle);if(T.detached){tear();return;}wheelIdle=setTimeout(springBack,650);},{passive:false});
async function autoTear(){if(!admitted||tearing)return;stopHint();if(reduced.matches){tearing=true;reveal();return;}const p0=T.p;await tween(1100*(1-p0),t=>pullTo(p0+(1-p0)*t),t=>t).finished;if(!T.detached){detach();render();}await tween(260,t=>{T.fx=10*t;T.fy=6*t;T.fr=3*t;render();}).finished;tear();}
async function tear(){if(!admitted||tearing||pendingHtml===null)return;tearing=true;stopHint();clearTimeout(wheelIdle);if(reduced.matches){reveal();return;}ticket.dataset.state='torn';dust();}

/* ---- dust: fine 1px grains, swept left → right, drifting and fading (reference: Dust delete) ---- */
function paintTicket(c){const tr=ticket.getBoundingClientRect(),{X0,H,holes}=geo(),W=mainEl.offsetWidth,WS=stub.offsetWidth,L=tr.left,Tp=tr.top;
 const rr=(x,y,w,h,r)=>{c.beginPath();c.roundRect(x,y,w,h,r);c.fill();};
 const text=(el,str,x,y)=>{const cs=getComputedStyle(el);c.font=cs.fontStyle+' '+cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily;try{c.letterSpacing=cs.letterSpacing==='normal'?'0px':cs.letterSpacing;}catch(e){}c.fillStyle=cs.color;c.textBaseline='middle';c.fillText(str,x,y);};
 const rel=el=>{const r=el.getBoundingClientRect();return {x:r.left,y:r.top,w:r.width,h:r.height};};
 // main
 c.save();c.fillStyle=PAPER;rr(L,Tp,W,H,[18,3,3,18]);
 const q=s=>mainEl.querySelector(s);let r=rel(q('.eyebrow'));text(q('.eyebrow'),'BOARDING PASS',r.x,r.y+r.h/2);
 r=rel(q('h1'));text(q('h1'),'LAS',r.x,r.y+r.h*.25);text(q('h1'),'VEGAS',r.x,r.y+r.h*.75);
 r=rel(q('.event'));text(q('.event'),'re:Invent 2026',r.x,r.y+r.h/2);r=rel(q('.rule'));c.fillStyle='#dee2da';c.fillRect(r.x,r.y,r.w,1);
 r=rel(q('.dates'));text(q('.dates'),'11.28 – 12.06',r.x,r.y+r.h/2);
 c.fillStyle=HOLE;for(const y of holes){c.beginPath();c.arc(L+X0-5,Tp+y,1.5,0,7);c.fill();}c.globalCompositeOperation='destination-out';c.fillStyle='#000';c.beginPath();c.arc(L+X0,Tp,7,0,7);c.arc(L+X0,Tp+H,7,0,7);c.fill();c.restore();
 // stub (with its current transform about the bottom-left pivot)
 const deg=T.detached?MAX_DEG+T.fr:angleFor(T.p,holes.length).deg;c.save();c.translate(L+X0+(T.detached?T.fx:0),Tp+H+(T.detached?T.fy:0));c.rotate(deg*Math.PI/180);c.translate(0,-H);
 c.fillStyle=PAPER;rr(0,0,WS,H,[3,18,18,3]);
 const st=stub.querySelector('.stamp');c.save();c.translate(st.offsetLeft+st.offsetWidth/2,st.offsetTop+st.offsetHeight/2);c.rotate(-13*Math.PI/180);c.globalAlpha=.88;c.strokeStyle='#a9724d';c.lineWidth=2;c.beginPath();c.roundRect(-st.offsetWidth/2+1,-st.offsetHeight/2+1,st.offsetWidth-2,st.offsetHeight-2,5);c.stroke();const cs=getComputedStyle(st);c.font=cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily;try{c.letterSpacing=cs.letterSpacing;}catch(e){}c.fillStyle='#a9724d';c.textAlign='center';c.textBaseline='middle';c.fillText('ADMIT ONE',0,1);c.restore();c.textAlign='left';
 const bc=stub.querySelector('.barcode');c.fillStyle='#47503d';c.globalAlpha=.65;for(let x=0;x<bc.offsetWidth;x+=10){c.fillRect(bc.offsetLeft+x,bc.offsetTop,1,25);c.fillRect(bc.offsetLeft+x+3,bc.offsetTop,2,25);c.fillRect(bc.offsetLeft+x+6,bc.offsetTop,1,25);}c.globalAlpha=1;
 const se=stub.querySelector('.serial');text(se,'LAS · 2026',se.offsetLeft,se.offsetTop+se.offsetHeight/2);
 c.globalCompositeOperation='destination-out';c.fillStyle='#000';c.beginPath();c.arc(0,0,7,0,7);c.arc(0,H,7,0,7);c.fill();c.restore();
 return {L,Tp,X0,H,W,WS};}
function dust(){ticket.dataset.state='dust';const cv=document.getElementById('dust'),dpr=Math.min(devicePixelRatio||1,2),tr=ticket.getBoundingClientRect(),sr=stub.getBoundingClientRect();
 const M=70,rx=Math.max(0,Math.floor(Math.min(tr.left,sr.left)-M)),ry=Math.max(0,Math.floor(Math.min(tr.top,sr.top)-M-30)),rw=Math.ceil(Math.max(tr.right,sr.right)+M)-rx,rh=Math.ceil(Math.max(tr.bottom,sr.bottom)+M)-ry;
 const W=Math.round(rw*dpr),Hh=Math.round(rh*dpr);cv.width=W;cv.height=Hh;cv.style.left=rx+'px';cv.style.top=ry+'px';cv.style.width=rw+'px';cv.style.height=rh+'px';
 const c=cv.getContext('2d',{willReadFrequently:true});c.setTransform(dpr,0,0,dpr,-rx*dpr,-ry*dpr);const g=paintTicket(c);c.setTransform(1,0,0,1,0,0);
 const src=new Uint32Array(c.getImageData(0,0,W,Hh).data.buffer.slice(0)),img=c.createImageData(W,Hh),out=new Uint32Array(img.data.buffer);
 const S=Math.max(1,Math.round(dpr)),xs=[],ys=[],cols=[],del=[],vx=[],vy=[],life=[],wob=[];const seamX=(g.L+g.X0-rx)*dpr;
 const stubL=(sr.left-rx)*dpr,stubR=(sr.right-rx)*dpr,mainL=(tr.left-rx)*dpr,mainR=seamX;
 for(let y=0;y<Hh;y+=S)for(let x=0;x<W;x+=S){const col=src[y*W+x];if((col>>>24)<12)continue;const onStub=x>seamX-2;const L0=onStub?stubL:mainL,R0=onStub?stubR:mainR,f=Math.max(0,Math.min(1,(x-L0)/Math.max(1,R0-L0)));
  xs.push(x);ys.push(y);cols.push(col);del.push((onStub?0:.32)+f*.62+(y/Hh)*.12+Math.random()*.28);vx.push((-8+Math.random()*34)*dpr);vy.push((-30+Math.random()*26)*dpr);life.push(.55+Math.random()*.45);wob.push(Math.random()*6.28);}
 const n=xs.length;ticket.style.visibility='hidden';const t0=performance.now();
 function frame(now){const t=(now-t0)/1000;out.fill(0);let alive=0;
  for(let i=0;i<n;i++){const u=(t-del[i])/life[i];if(u>=1)continue;alive++;let x=xs[i],y=ys[i],col=cols[i],sz=S;
   if(u>0){const e=Math.pow(u,1.5);x+=vx[i]*e+Math.sin(wob[i]+u*5)*2*dpr*u;y+=vy[i]*e;const a=Math.round(((col>>>24)/255)*Math.pow(1-u,1.4)*255);col=(col&0xffffff)|(a<<24);if(u>.35)sz=1;}
   x|=0;y|=0;if(x<0||y<0||x+sz>W||y+sz>Hh)continue;const k=y*W+x;out[k]=col;if(sz>1){out[k+1]=col;out[k+W]=col;out[k+W+1]=col;}}
  c.putImageData(img,0,0);if(alive)requestAnimationFrame(frame);else{c.clearRect(0,0,W,Hh);reveal();}}
 requestAnimationFrame(frame);}
window.__ticket={state:()=>({p:T.p,hint:T.hint,detached:T.detached,broken:T.broken,tearing,admitted}),pullTo,springBack,autoTear,tear,render,stopHint};
</script></body></html>
